# Evaluation helper, not part of the agent. Runs the same deterministic collector
# as the analyst's pre-agent step (collect_context.py) with the same read-only
# permissions and gate, and uploads the bundle as an artifact. The dry-run
# evaluation (evals/golden/README.md, mode 3) feeds these bundles to a fresh
# Claude session, because the analyst's own agent job cannot start without the
# ANTHROPIC_API_KEY secret. Delete this file once live runs are possible.
name: CI context capture (eval)

on:
  workflow_run:
    workflows: ["Replay CI failure"]
    types: [completed]
    branches: ["eval/**", "adv/**"]

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

jobs:
  capture:
    if: >-
      vars.CI_ANALYST_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out' ||
       github.event.workflow_run.conclusion == 'action_required')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .claude
      - name: Collect CI failure context
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 .claude/skills/ci-failure-triage/scripts/collect_context.py --run-id "$RUN_ID" --out ci-context
      - uses: actions/upload-artifact@v5
        with:
          name: ci-context-${{ github.event.workflow_run.id }}
          path: ci-context
          retention-days: 90
